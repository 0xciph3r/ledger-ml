name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: gofmt -l .
        shell: bash
        working-directory: .
      - run: test -z "$(gofmt -l .)"
      - run: make test
      - run: go vet ./...
      - run: git diff --exit-code

  python:
    name: Python workload tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [training, serving, monitoring]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            training/requirements.txt
            serving/requirements.txt
            monitoring/requirements.txt
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -r ${{ matrix.component }}/requirements.txt
      - run: PYTHONPATH=. python -m pytest -q ${{ matrix.component }}/tests

  manifests:
    name: Kubernetes assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: make generate manifests
      - run: git diff --exit-code
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - run: |
          kubectl apply --dry-run=client -f config/crd/bases
          kubectl apply --dry-run=client -f config/webhook

  container-build:
    name: Build workload images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: trainer
            file: training/Dockerfile
          - name: evaluator
            file: training/Dockerfile.evaluator
          - name: serving
            file: serving/Dockerfile
          - name: monitoring
            file: monitoring/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: ledger-ml/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

