apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: ledger-ml-batch
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - nvidia.com/gpu
      flavors:
        - name: general
          resources:
            - name: cpu
              nominalQuota: 16
            - name: memory
              nominalQuota: 64Gi
            - name: nvidia.com/gpu
              nominalQuota: 0
