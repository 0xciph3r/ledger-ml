---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: riskmodels.ledger.ledgerml.io
spec:
  group: ledger.ledgerml.io
  names:
    kind: RiskModel
    listKind: RiskModelList
    plural: riskmodels
    shortNames:
    - rm
    singular: riskmodel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.task
      name: Task
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.modelVersion
      name: Version
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RiskModel is the Schema for the riskmodels API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RiskModelSpec defines the desired state of RiskModel.
            properties:
              approvals:
                description: Approvals are explicit human approvals observed by the
                  controller.
                items:
                  description: ModelApproval captures a human approval statement.
                  properties:
                    approvedAt:
                      description: ApprovedAt is the approval timestamp.
                      format: date-time
                      type: string
                    approver:
                      description: Approver is the identity of the approver (user/group
                        alias).
                      minLength: 1
                      type: string
                    comment:
                      description: Comment is optional, non-PII approval context.
                      type: string
                    reference:
                      description: Reference is an optional ticket or change request
                        identifier.
                      type: string
                  required:
                  - approvedAt
                  - approver
                  type: object
                type: array
              datasetRef:
                description: DatasetRef points to training dataset input.
                properties:
                  kind:
                    default: ConfigMap
                    description: Kind identifies how the dataset should be resolved.
                    enum:
                    - ConfigMap
                    - PersistentVolumeClaim
                    - ObjectStore
                    type: string
                  name:
                    description: Name is the resource/bucket identifier.
                    minLength: 1
                    type: string
                  path:
                    description: Path is the key/path inside the dataset source.
                    minLength: 1
                    type: string
                required:
                - name
                - path
                type: object
              lineage:
                description: Lineage captures immutable identity (image digest, dataset
                  version, artifact version, config digest).
                properties:
                  configurationDigest:
                    description: ConfigurationDigest identifies immutable training
                      configuration.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  datasetVersion:
                    description: DatasetVersion identifies an immutable dataset snapshot
                      (commit/version/object generation).
                    minLength: 1
                    type: string
                  outputArtifactVersion:
                    description: OutputArtifactVersion identifies the intended immutable
                      artifact version.
                    minLength: 1
                    type: string
                  trainingImageDigest:
                    description: TrainingImageDigest is the immutable digest for spec.trainingImage
                      content.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                required:
                - configurationDigest
                - datasetVersion
                - outputArtifactVersion
                - trainingImageDigest
                type: object
              outputRef:
                description: OutputRef points to model artifact output location.
                properties:
                  kind:
                    default: PersistentVolumeClaim
                    description: Kind identifies the output backend.
                    enum:
                    - PersistentVolumeClaim
                    - ObjectStore
                    type: string
                  name:
                    description: Name is the output target identifier.
                    minLength: 1
                    type: string
                  path:
                    description: Path is the output key/path prefix.
                    minLength: 1
                    type: string
                required:
                - name
                - path
                type: object
              policy:
                description: Policy controls resource safety and approval semantics.
                properties:
                  approval:
                    description: ApprovalPolicy defines approval semantics before
                      promotion.
                    properties:
                      allowedApprovers:
                        description: AllowedApprovers limits approval identities when
                          set.
                        items:
                          type: string
                        type: array
                      minimumApprovals:
                        default: 1
                        description: MinimumApprovals is the number of unique approvals
                          required when Required is true.
                        format: int32
                        minimum: 1
                        type: integer
                      required:
                        default: true
                        description: Required indicates if approval is needed after
                          successful training.
                        type: boolean
                    type: object
                  resourceBounds:
                    description: ResourceBoundsPolicy defines allowed training resources.
                    properties:
                      maxCPU:
                        default: "2"
                        description: MaxCPU is the maximum allowed CPU request/limit.
                        type: string
                      maxGPU:
                        default: "0"
                        description: MaxGPU is the maximum allowed GPU limit (`nvidia.com/gpu`).
                        type: string
                      maxMemory:
                        default: 4Gi
                        description: MaxMemory is the maximum allowed memory request/limit.
                        type: string
                    type: object
                type: object
              resources:
                description: Resources declares container resource requests/limits
                  for training.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              serving:
                description: Serving captures deployment intent used by later milestones.
                properties:
                  enabled:
                    description: Enabled toggles inference deployment.
                    type: boolean
                  image:
                    description: Image is the serving container image.
                    type: string
                  port:
                    default: 8080
                    description: Port is the serving container port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  replicas:
                    default: 1
                    description: Replicas is the desired serving replica count.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              task:
                default: fraud-scoring
                description: Task defines the ML workflow to execute.
                enum:
                - fraud-scoring
                type: string
              trainingImage:
                description: |-
                  TrainingImage is the container image for the training job.
                  Mutable tags are not production-safe; pair with lineage.trainingImageDigest.
                minLength: 1
                type: string
            required:
            - datasetRef
            - lineage
            - outputRef
            - trainingImage
            type: object
          status:
            description: RiskModelStatus defines the observed state of RiskModel.
            properties:
              approvedBy:
                description: ApprovedBy lists approvers counted toward policy.
                items:
                  type: string
                type: array
              conditions:
                description: Conditions contain granular reconciliation signals.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              evidence:
                description: Evidence captures key governance decisions.
                items:
                  description: RiskModelEvidence records governance-relevant lifecycle
                    decisions.
                  properties:
                    decision:
                      description: Decision is a machine-readable decision name.
                      type: string
                    jobName:
                      description: JobName links a decision to a training Job when
                        applicable.
                      type: string
                    message:
                      description: Message provides operator-facing context without
                        raw transaction data.
                      type: string
                    observedGeneration:
                      description: ObservedGeneration links evidence to the reconciled
                        generation.
                      format: int64
                      type: integer
                    reason:
                      description: Reason is a short decision reason.
                      type: string
                    time:
                      description: Time is when the decision was observed.
                      format: date-time
                      type: string
                  required:
                  - decision
                  - reason
                  - time
                  type: object
                type: array
              lineageHash:
                description: LineageHash is the controller-calculated hash of immutable
                  identity fields.
                type: string
              message:
                description: Message is a human-readable explanation of the current
                  phase.
                type: string
              modelVersion:
                description: ModelVersion is populated once an immutable model artifact
                  is produced.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent reconciled metadata
                  generation.
                format: int64
                type: integer
              phase:
                description: Phase provides a high-level workflow stage.
                type: string
              reason:
                description: Reason is a machine-readable summary of the current phase.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
