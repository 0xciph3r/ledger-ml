apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-ml-controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
        - name: manager
          volumeMounts:
            - name: webhook-server-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-server-cert
          secret:
            secretName: ledger-ml-webhook-server-cert
