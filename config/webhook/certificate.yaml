apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ledger-ml-webhook-certificate
  namespace: system
spec:
  secretName: ledger-ml-webhook-server-cert
  issuerRef:
    name: ledger-ml-selfsigned
    kind: Issuer
  dnsNames:
    - ledger-ml-webhook-service.system.svc
    - ledger-ml-webhook-service.system.svc.cluster.local
