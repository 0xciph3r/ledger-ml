apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: ledger-ml-validating-webhook
  annotations:
    cert-manager.io/inject-ca-from: system/ledger-ml-webhook-certificate
webhooks:
  - name: vriskmodel.kb.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    clientConfig:
      service:
        name: ledger-ml-webhook-service
        namespace: system
        path: /validate-ledger-ledgerml-io-v1alpha1-riskmodel
        port: 443
    rules:
      - apiGroups:
          - ledger.ledgerml.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - riskmodels
        scope: Namespaced
