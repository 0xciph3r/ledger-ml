apiVersion: ledger.ledgerml.io/v1alpha1
kind: RiskModel
metadata:
  name: fraud-risk-model
  namespace: default
spec:
  task: fraud-scoring
  trainingImage: ghcr.io/ledger-ml/trainer:latest
  lineage:
    trainingImageDigest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    datasetVersion: synthetic-fraud-2026-09-12
    outputArtifactVersion: fraud-model-v1
    configurationDigest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  datasetRef:
    kind: ConfigMap
    name: fraud-training-data
    path: data/transactions.csv
  outputRef:
    kind: PersistentVolumeClaim
    name: model-artifacts
    path: fraud/models
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  policy:
    resourceBounds:
      maxCPU: "2"
      maxMemory: "4Gi"
      maxGPU: "0"
    approval:
      required: true
      minimumApprovals: 1
      allowedApprovers:
        - risk-owner
  serving:
    enabled: false
  approvals: []
